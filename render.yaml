services:
  - type: web
    name: ai-watermark-remover
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app -b 0.0.0.0:$PORT --timeout 300 --workers 1"
    healthCheckPath: /api/health
    envVars:
      # 生成式 AI 擦除：走百炼 wanx2.1-imageedit（带遮罩精修，框外零改动）
      - key: EDIT_PROVIDER
        value: dashscope
      # AI 视觉定位：qwen3.8-flash（精准识别右下角水印框）
      - key: DETECT_PROVIDER
        value: dashscope
      - key: DASHSCOPE_VL_MODEL
        value: qwen3.8-flash
      # DASHSCOPE_API_KEY 已在 Render Dashboard 以敏感变量配置，不写进此文件。
      # 若想改回离线免费引擎：把 EDIT_PROVIDER / DETECT_PROVIDER 都改为 opencv 即可。
